[project]
name = "erp-helpdesk"
version = "1.0.0"
description = "Agentic AI Helpdesk for ERP System with Multi-Modal Support"
authors = [{name = "Your Team"}]
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",  # ADD THIS - new Chroma package
    "chromadb>=0.5.0",
    "gradio>=4.0.0,<6.0.0",  # FIX: Use Gradio 5.x for compatibility
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tiktoken>=0.7.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]